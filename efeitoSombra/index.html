<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Blur</title>
    <style>
        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }

        .codigo {
            display: flex;
            gap: 20px
        }

        .codigo span{
            color: white;
            font-size: clamp(45px, 80px, 80px);
            filter: blur(20px);
            transition: 0.3s;
        }
/* Numero em foco */
        .codigo span:hover,
        .codigo span:active {
            filter: blur(0);
            transform: scal (1.08);
        
        }
        /*numero da direita*/

        .codigo span:hover + span {
            filter: blur(6px);
        }
        /* Segundo numero da direita */
        .codigo span:hover + span + span {
            filter: blur(10px);
        }
        /* Numero da esquerda */
                .codigo span:has(+ span:hover) {
            filter: blur(6px);
                }

            /*Segundo numero da esquerda */
            .codigo span:has(+ span + span:hover ){
                filter: blur(10px);
            }

        
    </style>

</head>
<body>
    <div class="codigo">
        <span>2</span>
        <span>4</span>
        <span>6</span>
        <span>8</span>
        <span>10</span>
        <span>0</span>
    </div>
</body>
</html>
